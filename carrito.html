<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <script src="script.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos - PureStyler</title>
    <link rel="stylesheet" href="carrito.css">
</head>
<body>
    <header>
        <!-- Tu encabezado normal -->
        <a href="carrito.html" class="carrito-link">
            🛒 <span id="contador-carrito"></span>
        </a>
    </header>

    <section class="productos">
        <div class="producto" data-id="1">
            <img src="camisa.jpg" alt="Camisa" class="producto-imagen">
            <h3 class="producto-nombre">Camisa Elegante</h3>
            <p class="producto-precio">$25.99</p>
            <button class="agregar-carrito">Agregar al carrito</button>
        </div>

        <div class="producto" data-id="2">
            <img src="pantalon.jpg" alt="Pantalón" class="producto-imagen">
            <h3 class="producto-nombre">Pantalón de Vestir</h3>
            <p class="producto-precio">$35.99</p>
            <button class="agregar-carrito">Agregar al carrito</button>
        </div>
    </section>

    <script src="carrito.js"></script>
</body>
</html>
